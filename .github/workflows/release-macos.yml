name: Release macOS

# Required repo secrets:
#   APPLE_CERTIFICATE              - base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD     - password the .p12 was exported with
#   KEYCHAIN_PASSWORD              - any password, used for the throwaway CI keychain
#   APPLE_ID                       - Apple ID email, for notarization
#   APPLE_APP_SPECIFIC_PASSWORD    - app-specific password for that Apple ID
#   APPLE_TEAM_ID                  - Developer team ID (U9379CAYS9)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('elm.json', 'review/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          if ! openssl pkcs12 -in "$CERT_PATH" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -noout -legacy 2>/dev/null \
             && ! openssl pkcs12 -in "$CERT_PATH" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -noout 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE did not decode to a valid .p12 readable with APPLE_CERTIFICATE_PASSWORD. Re-export the Developer ID Application certificate (select both the cert and its private key in Keychain Access) as a .p12, then run: base64 -i cert.p12 | pbcopy, and replace the APPLE_CERTIFICATE secret with that."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Build and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build

      - name: Determine release tag
        id: release
        run: |
          case "${{ github.event_name }}" in
            release)
              echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Ripple-macOS
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ github.event_name != 'release' && format('Ripple {0}', steps.release.outputs.tag) || '' }}
          generate_release_notes: ${{ github.event_name != 'release' }}
          files: src-tauri/target/release/bundle/dmg/*.dmg
